[project]
name = "backdate"
version = "0.1.0"
description = "Bitemporal facts for Django on Postgres, with retroactive recomputation of everything derived from them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "django>=6.1,<6.2",
  "psycopg[binary]>=3.2",
  "structlog>=25.1",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
tracing = ["opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30"]
server = ["gunicorn>=23"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "hypothesis>=6.120",
  "ruff>=0.9",
  "mypy>=1.14",
  "django-stubs[compatible-mypy]>=5.1",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backdate"]
