[project]
name = "backdate"
version = "0.1.0"
description = "Bitemporal facts for Django on Postgres, with retroactive recomputation of everything derived from them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "django>=6.1,<6.2",
  "psycopg[binary]>=3.2",
  "structlog>=25.1",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
tracing = ["opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30"]
server = ["gunicorn>=23"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "hypothesis>=6.120",
  "ruff>=0.9",
  "mypy>=1.14",
  "django-stubs[compatible-mypy]>=5.1",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backdate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DJ", "PL", "PT", "TRY"]
ignore = [
  "PLR0913",  # some write paths take many keyword arguments on purpose
  "PLR2004",  # magic numbers are fine in tests and benches
  "TRY003",
  "RUF012",   # Django Meta attributes are class-level lists by convention
  "DJ008",    # internal rows do not need a __str__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR0915", "S105", "S106"]
"bench/**" = ["S101", "S311", "T201"]
"**/migrations/**" = ["E501", "RUF", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "bench/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["psycopg.*", "opentelemetry.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "server.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "server.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long running concurrency or crash tests",
]
